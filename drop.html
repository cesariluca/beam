<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Send to the Training Room</title>
<!-- Beam "drop" page: public (no password), opened from the QR code inside the training room. It only sends, and only
     to the room PC registered under today's code (PeerJS id "oatr-<code>"); relay credentials come from
     /api/turn-drop, which checks the code. The file goes from this phone straight to the room PC (WebRTC, encrypted). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js" integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous"></script>
<style>
:root { --bg: #f4f6f9; --card: #fff; --text: #14202e; --dim: #5b6b7d; --line: #dfe5ec; --accent: #e8703a; --ok: #1f9d6a; --bad: #d64545; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1b2d; --card: #17263a; --text: #eef3f8; --dim: #9fb3c8; --line: #263a52; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; justify-content: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
main { width: 100%; max-width: 460px; }
h1 { font-size: 1.5rem; margin: 8px 0 4px; }
.sub { color: var(--dim); margin: 0 0 22px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
.state { display: flex; align-items: center; gap: 12px; font-weight: 600; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.wait { animation: pulse 1.2s infinite; } .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
@keyframes pulse { 50% { opacity: .3 } }
.msg { color: var(--dim); margin: 10px 0 0; font-size: .95rem; }
label.pick { display: block; margin-top: 20px; text-align: center; padding: 18px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 700; font-size: 1.1rem; cursor: pointer; }
label.pick.off { opacity: .4; pointer-events: none; }
input[type=file] { display: none; }
.files { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 10px; }
.files li { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.files b { display: block; overflow-wrap: anywhere; font-weight: 600; }
.files small { color: var(--dim); }
.files li.done small { color: var(--ok); } .files li.err small { color: var(--bad); }
progress { width: 100%; height: 8px; margin-top: 8px; accent-color: var(--accent); }
.foot { color: var(--dim); font-size: .85rem; margin-top: 18px; text-align: center; }
</style>
</head><body><main>
<h1>Send a file to the board</h1>
<p class="sub">Training Room · it appears in <b>Files</b> on the touch panels</p>
<div class="card">
  <div class="state"><span class="dot wait" id="dot"></span><span id="state">Connecting to the room…</span></div>
  <p class="msg" id="msg">This takes a few seconds.</p>
  <label class="pick off" id="pick">Choose a file<input type="file" id="file" multiple></label>
  <ul class="files" id="files"></ul>
</div>
<p class="foot">Goes straight from this phone to the room PC, encrypted. Presentations, PDFs, Word/Excel, pictures and videos.</p>
</main>
<script src="/js/drop.js"></script>
</body></html>
