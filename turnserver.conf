# ============================================================
#  Beam TURN relay — coturn config for use with the serverless
#  credential function (short-lived HMAC credentials).
#  Only needed if you self-host coturn (TURN_PROVIDER=coturn).
#  Fill in the <PLACEHOLDERS>, then follow serverless-setup.md.
# ============================================================

# --- Listeners ---
listening-port=3478
tls-listening-port=443            # TURNS over TLS/443 → slips past inspection firewalls

# --- Identity ---
external-ip=<PUBLIC_IP>           # or  external-ip=PUBLIC_IP/PRIVATE_IP  if behind NAT
realm=<turn.yourdomain.com>       # must match the TLS cert and TURN_HOST in Netlify
server-name=<turn.yourdomain.com>

# --- Authentication: time-limited HMAC credentials (TURN REST API) ---
# No static user/password here. The serverless function signs short-lived
# credentials with this same secret. Set Netlify's TURN_SECRET to this value.
use-auth-secret
static-auth-secret=<GENERATE_WITH: openssl rand -hex 32>

# --- TLS (Let's Encrypt) ---
cert=/etc/letsencrypt/live/<turn.yourdomain.com>/fullchain.pem
pkey=/etc/letsencrypt/live/<turn.yourdomain.com>/privkey.pem
no-tlsv1
no-tlsv1_1
dh2066

# --- Relay UDP port range (open these in the firewall) ---
min-port=49152
max-port=65535

# --- Hardening ---
fingerprint
stale-nonce
no-multicast-peers
no-cli
no-tcp-relay
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- Abuse limits ---
user-quota=12
total-quota=1200

# --- Logging ---
log-file=/var/log/turnserver/turn.log
simple-log
